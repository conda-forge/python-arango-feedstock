schema_version: 1

context:
  name: python-arango
  version: "8.3.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 28934f30c3e1de7419587bbcc0cbcda44684cc8d0f5e8027e85174aa6bedd07f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - urllib3 >=1.26.0
    - requests
    - requests-toolbelt
    - pyjwt >=2.10.0
    - packaging >=23.1

tests:
  - python:
      imports:
        - arango
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python Driver for ArangoDB
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ArangoDB-Community/python-arango
  repository: https://github.com/ArangoDB-Community/python-arango
  documentation: https://python-driver-for-arangodb.readthedocs.io/

extra:
  recipe-maintainers:
    - xylar
    - carlodri
    - aMahanna
    - xylar
